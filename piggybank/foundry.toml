[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
electroneum_testnet = "${ETN_TESTNET_RPC_URL}"
electroneum_mainnet = "${ETN_MAINNET_RPC_URL}"

[etherscan]
electroneum_testnet = { key = "${ETHERSCAN_API_KEY}", url = "${ETN_TESTNET_EXPLORER_URL}" }
electroneum_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "${ETN_MAINNET_EXPLORER_URL}" }
